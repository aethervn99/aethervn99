    <radialGradient id="planet"><stop stop-color="#34375b"/><stop offset=".65" stop-color="#242642"/><stop offset="1" stop-color="#101527"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#9980d4" stop-opacity=".2"/><stop offset=".6" stop-color="#d9b888"/><stop offset="1" stop-color="#d9b888" stop-opacity=".1"/></linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#background)"/>
  <g fill="#c5c7e9" opacity=".55">
    <circle cx="684" cy="42" r="1.3"/><circle cx="741" cy="259" r="1"/><circle cx="806" cy="96" r="1.4"/><circle cx="872" cy="36" r="1"/><circle cx="1133" cy="73" r="1.8"/><circle cx="1154" cy="238" r="1"/><circle cx="1034" cy="283" r="1.2"/><circle cx="652" cy="179" r="1"/><circle cx="964" cy="58" r="1.2"/>
